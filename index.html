<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>CyberRoadmap — Cybersecurity OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div><strong>CyberRoadmap</strong><span>Information Security</span></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="searchBtn" title="Поиск">⌕</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <nav class="bottom-nav">
    <button data-view="home" class="nav-btn active"><span>⌂</span><small>Главная</small></button>
    <button data-view="roadmap" class="nav-btn"><span>▤</span><small>Roadmap</small></button>
    <button data-view="today" class="nav-btn"><span>✓</span><small>Сегодня</small></button>
    <button data-view="notes" class="nav-btn"><span>✎</span><small>Заметки</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <section class="modal-card" id="modalCard"></section>
</div>
<script src="app.js"></script>
</body>
</html>
