<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>CyberRoadmap</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="go('home')">
        <div class="brand-mark">C</div>
        <div><strong>CyberRoadmap</strong><small>Information Security</small></div>
      </div>
      <div class="top-actions">
        <div class="pill" id="streakPill">🔥 0</div>
        <div class="pill xp-pill" id="xpPill">⚡ 0 XP</div>
        <button class="icon-btn" onclick="openSettings()" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home" onclick="go('home')"><span>⌂</span><small>Главная</small></button>
      <button class="nav-btn" data-view="learn" onclick="go('learn')"><span>📚</span><small>Учиться</small></button>
      <button class="nav-btn" data-view="practice" onclick="go('practice')"><span>🧪</span><small>Практика</small></button>
      <button class="nav-btn" data-view="notes" onclick="go('notes')"><span>📝</span><small>Заметки</small></button>
      <button class="nav-btn" data-view="profile" onclick="go('profile')"><span>👤</span><small>Профиль</small></button>
    </nav>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-backdrop" onclick="closeModal()"></div><div id="modalCard" class="modal-card"></div></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
