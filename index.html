<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>CyberRoadmap</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand-title">CyberRoadmap</div>
          <div class="brand-subtitle">Information Security</div>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙</button>
    </header>

    <main id="app" class="main"></main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-btn active" data-route="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-btn" data-route="roadmap"><span>▤</span><small>Roadmap</small></button>
      <button class="nav-btn" data-route="today"><span>✓</span><small>Сегодня</small></button>
      <button class="nav-btn" data-route="notes"><span>✎</span><small>Заметки</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
