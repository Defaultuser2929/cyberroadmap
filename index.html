<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CyberRoadmap</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Назад">‹</button>
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <div class="brand-title">CyberRoadmap</div>
          <div class="brand-subtitle">Information Security</div>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Настройки">⚙</button>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-route="roadmap"><span>▤</span><small>Roadmap</small></button>
      <button class="nav-item" data-route="today"><span>✓</span><small>Сегодня</small></button>
      <button class="nav-item" data-route="notes"><span>✎</span><small>Заметки</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><h3 id="modalTitle">Редактирование</h3><button id="modalClose" class="icon-btn">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
